[package]
name = "dsh-desktop"
version = "0.1.0-rc.5"
description = "DeepSeek Harness Tauri desktop shell"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
url = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
